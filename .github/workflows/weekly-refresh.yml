# Every Monday: pull fresh postings, label them with Jev, publish site/data.json.
# The push to main triggers the Vercel deploy. About $0.11 per run, capped at $0.30.
# Runs in GitHub's cloud, so it doesn't depend on the owner's PC being awake
# (the Windows Task Scheduler run missed Oct 12 and 19). TYPESAFE_API_KEY is an
# encrypted repository secret. GitHub emails the owner when a run fails.
name: Weekly radar refresh

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC = 7:00 Toronto in summer, 6:00 in winter
  workflow_dispatch:       # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A Monday soon after a refresh is skipped, so a manual run late in the week
      # (2026-10-24) covers the next Monday too. A manual run always goes ahead.
      - name: Skip if refreshed in the last 6 days
        id: gate
        if: github.event_name == 'schedule'
        run: |
          last=$(python3 -c "import json; print(json.load(open('site/data.json'))['run']['date'])")
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          if [ "$age" -lt 6 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Last refresh $last, $age days ago: skipping this Monday."
          fi

      - name: Fetch postings
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p jev-runs/weekly
          python3 radar/fetch.py --out jev-runs/weekly/input.jsonl | tee jev-runs/weekly/fetch.log

      - name: Label with Jev
        if: steps.gate.outputs.skip != 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 scripts/jev.py run radar/spec.json jev-runs/weekly/input.jsonl --out jev-runs/weekly --max-cost 0.30

      - name: Export site data
        if: steps.gate.outputs.skip != 'true'
        run: |
          scanned=$(grep -oE '^[0-9,]+ open roles' jev-runs/weekly/fetch.log | tr -dc 0-9)
          trigger=$([ "${{ github.event_name }}" = schedule ] && echo scheduled || echo manual)
          python3 scripts/export_site.py jev-runs/weekly --scanned "$scanned" --date "$(date -u +%F)" --trigger "$trigger"

      - name: Commit and push
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "Gurnek Khaira"
          git config user.email "319908404+gurn3k@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly radar refresh $(date -u +%F) (automated)"
          git push origin HEAD:main
